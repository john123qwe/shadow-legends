
name: Build SHADOW LEGENDS APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate and extract game ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -name '*.zip' | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "Game ZIP not found"
            exit 1
          fi

          mkdir -p extracted
          unzip -oq "$ZIP_FILE" -d extracted

          PROJECT_FILE=$(find extracted -type f -name project.godot -print -quit)

          if [ -z "$PROJECT_FILE" ]; then
            echo "project.godot not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")
          echo "PROJECT_DIR=$GITHUB_WORKSPACE/$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: |
            platform-tools

      - name: Install Android SDK components
        run: |
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Download Godot 4.3
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q Godot_v4.3-stable_linux.x86_64.zip
          chmod +x Godot_v4.3-stable_linux.x86_64
          sudo mv Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot

      - name: Install Godot export templates
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable"
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          unzip -q Godot_v4.3-stable_export_templates.tpz -d templates
          cp -r templates/templates/* "$HOME/.local/share/godot/export_templates/4.3.stable/"

      - name: Configure Android signing
        run: |
          mkdir -p "$HOME/.config/godot" "$HOME/.local/share/godot/keystores"
          keytool -genkeypair -v \
            -keystore "$HOME/.local/share/godot/keystores/debug.keystore" \
            -storepass android -alias androiddebugkey \
            -keypass android -keyalg RSA -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          cat > "$HOME/.config/godot/editor_settings-4.3.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/debug_keystore = "$HOME/.local/share/godot/keystores/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Import and validate project
        run: |
          godot --headless --path "$PROJECT_DIR" --import
          godot --headless --path "$PROJECT_DIR" --script tests/run_checks.gd
   
              
      - name: Install Android build template
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail

          TEMPLATE_ZIP="$HOME/.local/share/godot/export_templates/4.3.stable/android_source.zip"
          ANDROID_DIR="$PROJECT_DIR/android"

          if [[ ! -s "$TEMPLATE_ZIP" ]]; then
            echo "::error::Android source template ZIP not found."
            exit 1
          fi

          mkdir -p "$ANDROID_DIR"

          unzip -oq "$TEMPLATE_ZIP" -d "$ANDROID_DIR"

          printf '4.3.stable\n' > "$ANDROID_DIR/.build_version"

          test -s "$ANDROID_DIR/.build_version"
          test -f "$ANDROID_DIR/build.gradle"

          echo "Godot Android template version:"
          cat "$ANDROID_DIR/.build_version"

          echo "Android template installation completed."


      - name: Build Bazaar APK
        run: |
          mkdir -p "$PROJECT_DIR/build"
          godot --headless --path "$PROJECT_DIR" \
            --export-debug "shadow_legends_bazaar" \
            "$PROJECT_DIR/build/SHADOW_LEGENDS_Bazaar.apk"
          test -s "$PROJECT_DIR/build/SHADOW_LEGENDS_Bazaar.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SHADOW-LEGENDS-APK
          path: project/build/SHADOW_LEGENDS_Bazaar.apk
          if-no-files-found: error
          retention-days: 14
